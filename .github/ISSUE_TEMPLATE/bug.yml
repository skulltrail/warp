name: Bug report
description: Report a reproducible warp problem
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chromium, Firefox, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: warp version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include expected and actual behavior. Remove credentials and private URLs.
    validations:
      required: true
